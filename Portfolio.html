<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — 포트폴리오</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root{
    --bg: #FAFAFA;
    --fg: #1a1a1a;
    --fg-2: #4a4a4a;
    --fg-3: #808080;
    --fg-4: #b8b8b8;
    --line: #ececec;
    --line-strong: #d4d4d4;
    --card: #ffffff;
    --accent: #1a1a1a;
    --accent-fg: #FAFAFA;
    --pop: #1E40AF;
    --pop-soft: color-mix(in oklch, var(--pop) 12%, transparent);
    --radius: 14px;
    --radius-sm: 8px;
    --maxw: 1240px;
    --pad: 24px;
    --section-gap: 120px;
    --header-h: 60px;
  }
  body[data-bg="lilac"]{
    --bg:#FAFAFA;
    --line:#ececec;
    --line-strong:#d4d4d4;
    --card:#ffffff;
  }
  body[data-bg="lavender"]{
    --bg:#f4eefb;
    --line:#e6dbf2;
    --line-strong:#d2c0e6;
    --card:#fbf8ff;
  }
  body[data-bg="plum"]{
    --bg:#0e0518;
    --fg:#f5edff;
    --fg-2:#d2c2e8;
    --fg-3:#9484a8;
    --fg-4:#5a4a72;
    --line:#231038;
    --line-strong:#33184f;
    --card:#170926;
    --accent:#f5edff;
    --accent-fg:#0e0518;
  }
  body[data-bg="pure"]{
    --bg:#ffffff;
    --line:#f0f0f0;
    --line-strong:#dcdcdc;
    --card:#fafafa;
  }
  [data-theme="dark"]{
    --bg:#0a0612;
    --fg:#f5edff;
    --fg-2:#d0c2e8;
    --fg-3:#8c7ea8;
    --fg-4:#4f4264;
    --line:#1d0f30;
    --line-strong:#2c1846;
    --card:#120824;
    --accent:#f5edff;
    --accent-fg:#0a0612;
  }
  body[data-theme="dark"][data-bg="lavender"]{
    --bg:#0f0820; --line:#22153a; --line-strong:#32214d; --card:#170c2c;
  }
  body[data-theme="dark"][data-bg="plum"]{
    --bg:#06030d; --line:#180a28; --line-strong:#241040; --card:#0c0418;
  }
  body[data-theme="dark"][data-bg="pure"]{
    --bg:#000000; --line:#1a0a2e; --line-strong:#270e44; --card:#080412;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Pretendard Variable','Pretendard',ui-sans-serif,system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  ::selection{ background:var(--pop); color:#fff; }

  .mono{ font-family:'JetBrains Mono',ui-monospace,monospace; letter-spacing:-0.01em; }
  .serif{ font-family:'Instrument Serif',ui-serif,Georgia,serif; font-style:italic; font-weight:400; }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  /* ────────── HEADER ────────── */
  .hdr{
    position:sticky; top:0; z-index:50;
    height:var(--header-h);
    background:color-mix(in oklch, var(--bg) 78%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    backdrop-filter:blur(14px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .hdr-inner{
    max-width:var(--maxw); margin:0 auto; padding:0 var(--pad);
    height:100%; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px;
  }
  .hdr-inner > .nav{ justify-self:center; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-0.01em; }
  .brand-mark{
    width:22px; height:22px; border-radius:6px;
    background:linear-gradient(135deg, var(--pop), color-mix(in oklch, var(--pop) 60%, #000));
    display:grid; place-items:center; color:#fff;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
  }
  .nav{ display:flex; align-items:center; gap:4px; }
  .nav a{
    padding:8px 14px; border-radius:999px; color:var(--fg-2);
    font-size:14px; font-weight:500; transition:all .15s ease;
  }
  .nav a:hover{ background:color-mix(in oklch, var(--pop) 10%, transparent); color:var(--pop); }
  .nav a.active{ background:var(--pop); color:#fff; }
  .hdr-right{ display:flex; align-items:center; gap:10px; }
  .hdr-meta{ font-size:12px; color:var(--fg-3); display:flex; align-items:center; gap:8px; }
  .hdr-dot{ width:6px; height:6px; border-radius:50%; background:var(--pop); box-shadow:0 0 0 3px color-mix(in oklch, var(--pop) 22%, transparent); }
  .resume-btn{
    height:34px; padding:0 14px; border-radius:999px;
    border:1px solid var(--line-strong); background:transparent; color:var(--fg);
    font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
    transition:all .15s ease;
  }
  .resume-btn:hover{ background:var(--pop); color:#fff; border-color:var(--pop); }

  /* ────────── LAYOUT ────────── */
  .container{ max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); }
  section{ scroll-margin-top:calc(var(--header-h) + 16px); }
  .section{ padding-top:var(--section-gap); }

  /* ────────── HERO ────────── */
  .hero{
    padding-top:80px;
    padding-bottom:120px;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; right:-200px; top:-200px;
    width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in oklch, var(--pop) 22%, transparent) 0%, transparent 70%);
    pointer-events:none;
  }
  .hero-grid{
    display:grid;
    grid-template-columns: 1fr 1.25fr;
    gap:80px;
    align-items:center;
    position:relative;
  }
  .hero-left{ padding-top:0; position:static; }
  .hero-right{ display:flex; flex-direction:column; gap:24px; }
  .hero-section-label{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.22em;
    text-align:center;
    padding:0;
    margin:0 0 48px;
    background:transparent;
  }
  .hero-photo{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    aspect-ratio: 4 / 3;
    border:1px solid var(--line);
    background:var(--card);
    box-shadow:0 30px 80px -40px color-mix(in oklch, var(--pop) 60%, transparent);
  }
  .hero-photo img{
    width:100%; height:100%; object-fit:cover; object-position:center center;
    display:block;
  }
  .hero-stats{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:16px;
  }
  .hero-stat{
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 24px;
    background:color-mix(in oklch, var(--card) 70%, transparent);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    display:flex; flex-direction:column; gap:8px;
    transition:border-color .2s ease, transform .2s ease;
  }
  .hero-stat:hover{ border-color:var(--pop); transform:translateY(-2px); }
  .hero-stat-num{
    font-family:'Playfair Display',serif; font-weight:700;
    font-size:42px; line-height:1; color:var(--pop);
    letter-spacing:-0.02em;
    display:flex; align-items:baseline; gap:4px;
  }
  .hero-stat-num .unit{ font-size:22px; font-weight:600; }
  .hero-stat-num .arr{
    font-size:20px; color:var(--pop); margin-left:4px;
    transform:translateY(-6px);
  }
  .hero-stat-label{
    font-size:15px; font-weight:700; color:var(--fg);
    margin-top:6px; letter-spacing:-0.01em;
  }
  .hero-stat-desc{
    font-size:12.5px; color:var(--fg-3); line-height:1.55;
    white-space:pre-line;
  }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--pop); text-transform:uppercase; letter-spacing:0.18em;
    margin-bottom:24px; font-weight:600;
  }
  .hero-eyebrow::before{
    content:""; width:0; height:0;
  }
  .hero h1{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size: clamp(48px, 5vw, 78px);
    line-height:0.95;
    letter-spacing:-0.025em;
    margin:0 0 20px;
    color:var(--fg);
  }
  .hero h1 .ln{ display:block; }
  .hero h1 em{
    font-family:'Playfair Display',serif; font-style:italic; font-weight:700;
    color:var(--pop);
  }
  .hero-role{
    font-size:20px; font-weight:600; color:var(--fg);
    letter-spacing:-0.01em;
    margin:0 0 28px;
  }
  .hero-quotes{
    display:flex; flex-direction:column; gap:14px;
    margin:0 0 32px;
  }
  .hero-quotes p{
    font-size:14px; line-height:1.6; color:var(--fg-2);
    margin:0; font-style:italic;
  }
  .hero-expertise{
    margin:0 0 24px;
  }
  .hero-section-mini{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--pop); text-transform:uppercase; letter-spacing:0.18em;
    font-weight:600; margin:0 0 12px;
  }
  .hero-tags-grid{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .hero-tag{
    font-size:12px; font-weight:500;
    padding:6px 12px; border-radius:999px;
    background:color-mix(in oklch, var(--pop) 8%, transparent);
    color:var(--pop);
    border:1px solid color-mix(in oklch, var(--pop) 18%, transparent);
  }
  .hero-divider{
    height:1px; background:var(--line); margin:24px 0;
  }
  .hero-contact{
    display:flex; flex-direction:column; gap:14px;
    padding-top:24px; border-top:1px solid var(--line);
  }
  .hero-contact-row{
    display:flex; align-items:center; gap:14px;
    font-size:14px; color:var(--fg);
  }
  .hero-contact-row .ic{
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line);
    display:grid; place-items:center;
    color:var(--fg-3); flex-shrink:0;
  }
  .hero-contact-row a{ color:var(--fg); }
  .hero-contact-row a:hover{ color:var(--pop); }
  .tag{
    font-family:inherit; font-size:11px; font-weight:500; letter-spacing:-0.005em;
    padding:5px 10px; border:1px solid var(--line-strong); border-radius:999px;
    color:var(--fg-2);
  }

  .contact-card{ display:none; }

  /* contact FAB */
  .fab-wrap{ position:fixed; right:24px; bottom:24px; z-index:60; }
  .fab-btn{
    position:relative;
    width:60px; height:60px; border-radius:50%; border:0;
    background:var(--pop); color:#fff; cursor:pointer;
    display:grid; place-items:center;
    box-shadow:0 14px 36px -10px color-mix(in oklch, var(--pop) 70%, transparent),
               0 0 0 4px color-mix(in oklch, var(--pop) 18%, transparent);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  }
  .fab-btn:hover{ transform:scale(1.06); }
  .fab-btn svg{ width:22px; height:22px; transition:transform .3s; }
  .fab-btn[data-open="1"]{ background:var(--accent); color:var(--accent-fg); }
  .fab-btn[data-open="1"] svg{ transform:rotate(135deg); }
  .fab-btn::after{
    content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    box-shadow:0 0 0 0 color-mix(in oklch, var(--pop) 60%, transparent);
    animation: fab-pulse 2.4s cubic-bezier(0,0,.2,1) infinite;
  }
  .fab-btn[data-open="1"]::after{ display:none; }
  @keyframes fab-pulse{
    0%{ box-shadow:0 0 0 0 color-mix(in oklch, var(--pop) 50%, transparent); }
    70%{ box-shadow:0 0 0 18px color-mix(in oklch, var(--pop) 0%, transparent); }
    100%{ box-shadow:0 0 0 0 color-mix(in oklch, var(--pop) 0%, transparent); }
  }
  .fab-card{
    position:absolute; right:0; bottom:76px;
    width:340px; padding:22px;
    background:var(--card); color:var(--fg);
    border:1px solid var(--line); border-radius:18px;
    box-shadow:0 30px 80px -20px color-mix(in oklch, var(--pop) 50%, transparent),
               0 4px 20px -4px rgba(0,0,0,.12);
    transform-origin: bottom right;
    transform:scale(.92) translateY(8px); opacity:0; pointer-events:none;
    transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s;
  }
  .fab-card[data-open="1"]{ transform:scale(1) translateY(0); opacity:1; pointer-events:auto; }
  .fab-card-h{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:14px;
  }
  .fab-card-h .dot{ width:6px; height:6px; border-radius:50%; background:var(--pop); display:inline-block; margin-right:6px; vertical-align:middle; }
  .fab-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 0; border-top:1px solid var(--line);
    font-size:13px;
  }
  .fab-row:first-of-type{ border-top:0; padding-top:2px; }
  .fab-row .k{ color:var(--fg-3); font-family:'JetBrains Mono',monospace; font-size:11px; }
  .fab-row .v{ color:var(--fg); font-weight:500; text-align:right; }
  .fab-row a.v:hover{ color:var(--pop); }
  .fab-actions{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin-top:16px; padding-top:16px; border-top:1px solid var(--line);
  }
  .fab-act{
    height:38px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border-radius:10px; font-size:13px; font-weight:500;
    transition:all .15s ease; cursor:pointer; border:0;
    font-family:inherit;
  }
  .fab-act.primary{ background:var(--pop); color:#fff; grid-column:1 / -1; }
  .fab-act.primary:hover{ background:color-mix(in oklch, var(--pop) 85%, #000); }
  .fab-act.secondary{ background:transparent; color:var(--fg); border:1px solid var(--line-strong); }
  .fab-act.secondary:hover{ background:color-mix(in oklch, var(--pop) 8%, transparent); border-color:var(--pop); color:var(--pop); }

  /* ────────── SECTION HEADERS ────────── */
  .section-head{
    display:grid;
    grid-template-columns: 1fr 2fr;
    gap:60px;
    padding-bottom:48px;
    border-bottom:1px solid var(--line);
    margin-bottom:48px;
  }
  .section-num{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
    color:var(--pop); letter-spacing:0.08em;
  }
  .section-title{
    font-size:42px; letter-spacing:-0.025em; line-height:1.05;
    font-weight:500; margin:8px 0 0;
  }
  .section-title em{ font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; color:var(--pop); }
  .section-desc{
    font-size:16px; color:var(--fg-2); line-height:1.6;
    align-self:end; max-width:520px;
  }
  .section-head--stack{ grid-template-columns:1fr; gap:16px; }
  .section-title--bold{ font-weight:700; }
  .section-title--bold em{ font-weight:700; }
  .section-desc--inline{
    margin:14px 0 0; align-self:auto; max-width:780px;
  }

  /* ────────── EXPERIENCE / EDU LIST ────────── */
  .filter-bar{ display:flex; align-items:center; gap:6px; margin-bottom:24px; }
  .filter-chip{
    appearance:none; border:1px solid var(--line-strong); background:transparent;
    color:var(--fg-2); font-size:12px; font-weight:500;
    padding:6px 12px; border-radius:999px; cursor:pointer;
    transition:all .15s ease;
    font-family:'JetBrains Mono',monospace;
  }
  .filter-chip:hover{ color:var(--pop); border-color:var(--pop); }
  .filter-chip.on{ background:var(--pop); color:#fff; border-color:var(--pop); }
  .filter-count{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--fg-3); }

  .timeline{ display:flex; flex-direction:column; }
  .tl-item{
    display:grid;
    grid-template-columns: 140px 1fr 200px;
    gap:32px;
    padding:24px 8px;
    border-top:1px solid var(--line);
    align-items:start;
    cursor:pointer;
    transition:background .15s ease;
    position:relative;
  }
  .tl-item:last-child{ border-bottom:1px solid var(--line); }
  .tl-item:hover{ background:color-mix(in oklch, var(--pop) 5%, transparent); }
  .tl-item.open{ background:color-mix(in oklch, var(--pop) 7%, transparent); }
  .tl-date{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--fg-3); padding-top:4px;
  }
  .tl-body{ display:flex; flex-direction:column; gap:6px; }
  .tl-title{ font-size:18px; font-weight:600; letter-spacing:-0.01em; line-height:1.3; }
  .tl-org{ font-size:14px; color:var(--fg-3); }
  .tl-meta{
    display:flex; flex-direction:column; gap:6px; align-items:flex-start;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3);
  }
  .tl-cat{
    padding:3px 8px; border-radius:4px;
    background:var(--line); color:var(--fg-2);
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .tl-cat[data-cat="experience"]{ background:color-mix(in oklch, var(--pop) 14%, transparent); color:var(--pop); }
  .tl-cat[data-cat="activity"]{ background:#fbf0d9; color:#9b6e10; }
  .tl-cat[data-cat="education"]{ background:#dcf3e6; color:#1d6b3d; }
  body[data-theme="dark"] .tl-cat[data-cat="activity"]{ background:#2d2510; color:#e3c47a; }
  body[data-theme="dark"] .tl-cat[data-cat="education"]{ background:#0f2a1f; color:#86d4ad; }

  .tl-expand{
    grid-column: 2 / 4;
    overflow:hidden;
    transition:max-height .25s ease, opacity .2s ease, margin .2s ease, padding .2s ease;
    max-height:0; opacity:0; padding:0;
  }
  .tl-item.open .tl-expand{
    max-height:600px; opacity:1; padding-top:16px; margin-top:8px;
    border-top:1px dashed var(--line-strong);
  }
  .tl-expand p{ margin:0 0 10px; color:var(--fg-2); font-size:14px; line-height:1.65; }
  .tl-expand ul{ margin:0; padding-left:18px; color:var(--fg-2); font-size:14px; line-height:1.7; }
  .tl-expand ul li::marker{ color:var(--pop); }
  .tl-skills{ display:flex; flex-wrap:wrap; gap:4px; margin-top:12px; }
  .tl-chev{
    width:14px; height:14px; color:var(--fg-3); transition:transform .2s ease;
    margin-top:6px;
  }
  .tl-item.open .tl-chev{ transform:rotate(45deg); color:var(--pop); }

  /* ────────── PROJECTS ────────── */
  .proj-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; }
  .proj-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .25s;
    display:flex; flex-direction:column;
  }
  .proj-card:hover{
    transform:translateY(-3px);
    border-color:color-mix(in oklch, var(--pop) 40%, var(--line-strong));
    box-shadow:0 16px 36px -18px color-mix(in oklch, var(--pop) 40%, transparent);
  }
  .proj-thumb{
    aspect-ratio: 16 / 9;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .proj-thumb-img{ object-position:center; }
  .proj-thumb-pattern{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, color-mix(in oklch, var(--pop) 6%, transparent) 0 1px, transparent 1px 14px);
  }
  .proj-thumb-label{
    position:absolute; left:16px; bottom:14px; right:16px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); display:flex; justify-content:space-between;
  }
  .proj-card.acc-1 .proj-thumb{ background: linear-gradient(135deg, color-mix(in oklch, var(--pop) 14%, var(--bg)), var(--bg)); }
  .proj-card.acc-2 .proj-thumb{ background: linear-gradient(160deg, color-mix(in oklch, var(--pop) 22%, var(--bg)), var(--bg)); }
  .proj-card.acc-3 .proj-thumb{ background: linear-gradient(200deg, color-mix(in oklch, var(--pop) 30%, var(--bg)), color-mix(in oklch, var(--pop) 8%, var(--bg))); }
  .proj-card.acc-4 .proj-thumb{ background: linear-gradient(135deg, color-mix(in oklch, var(--pop) 50%, #1a0f3a), #1a0f3a); }
  .proj-card.acc-4 .proj-thumb-label{ color: rgba(255,255,255,.6); }
  .proj-card.acc-5 .proj-thumb{ background:linear-gradient(120deg, color-mix(in oklch,var(--pop) 18%, var(--bg)), var(--bg)); }
  .proj-card.acc-6 .proj-thumb{ background:linear-gradient(150deg, color-mix(in oklch,var(--pop) 26%, var(--bg)), color-mix(in oklch,var(--pop) 6%, var(--bg))); }
  .proj-card.acc-7 .proj-thumb{ background:linear-gradient(190deg, color-mix(in oklch,var(--pop) 38%, var(--bg)), color-mix(in oklch,var(--pop) 12%, var(--bg))); }
  .proj-card.acc-8 .proj-thumb{ background:linear-gradient(135deg, color-mix(in oklch,var(--pop) 60%, #1a0f3a), #160a30); }
  .proj-card.acc-8 .proj-thumb-label{ color:rgba(255,255,255,.6); }

  /* 다크 + Plum 테마: acc-4 / acc-8 thumb 끝색 lift (배경 녹음 방지) */
  body[data-theme="dark"][data-bg="plum"] .proj-card.acc-4 .proj-thumb{
    background: linear-gradient(135deg, color-mix(in oklch, var(--pop) 50%, #2a1854), #2a1854);
  }
  body[data-theme="dark"][data-bg="plum"] .proj-card.acc-8 .proj-thumb{
    background: linear-gradient(135deg, color-mix(in oklch, var(--pop) 60%, #261248), #221040);
  }

  .proj-thumb-icon{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:14px;
    background:var(--card); border:1px solid var(--line);
    display:grid; place-items:center;
    color:var(--pop);
    box-shadow:0 8px 22px -10px color-mix(in oklch, var(--pop) 40%, transparent);
  }
  .proj-thumb-icon svg{ width:28px; height:28px; }
  .proj-thumb-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }
  .proj-thumb.has-image .proj-thumb-pattern{ display:none; }
  .proj-thumb.has-image::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:60px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    pointer-events:none;
  }
  .proj-thumb.has-image .proj-thumb-label{ color:rgba(255,255,255,.92); }

  .proj-body{ padding:22px 22px 24px; display:flex; flex-direction:column; gap:14px; flex:1; }
  .proj-meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--fg-3);
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .proj-year{
    display:inline-flex; align-items:center;
    padding:4px 12px; border-radius:999px;
    font-family:'Pretendard Variable','Pretendard',ui-sans-serif,system-ui,sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:0;
    color:var(--pop); text-transform:none;
    background:color-mix(in oklch, var(--pop) 12%, transparent);
    border:1px solid color-mix(in oklch, var(--pop) 35%, transparent);
  }
  .proj-title{ font-size:20px; font-weight:600; letter-spacing:-0.015em; line-height:1.25; }
  .proj-desc{ font-size:14px; color:var(--fg-2); line-height:1.55; flex:1; white-space:pre-line; }
  .proj-stack{ display:flex; flex-wrap:wrap; gap:5px; }
  .proj-foot{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; border-top:1px solid var(--line);
    font-size:13px; color:var(--fg-3);
  }
  .proj-arrow{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line-strong);
    display:grid; place-items:center; transition:all .2s ease;
  }
  .proj-card:hover .proj-arrow{ background:var(--pop); color:#fff; border-color:var(--pop); transform:rotate(-45deg); }
  .proj-foot-label{ transition:color .2s ease, font-weight .2s ease, transform .2s ease; }
  .proj-card:hover .proj-foot-label{ color:var(--pop); font-weight:600; transform:translateX(2px); }

  /* density */
  body[data-density="dense"] .section{ padding-top:80px; }
  body[data-density="dense"] .hero{ padding-top:60px; padding-bottom:60px; }
  body[data-density="dense"] .tl-item{ padding:18px 8px; }
  body[data-density="dense"] .proj-grid{ gap:14px; }
  body[data-density="airy"] .section{ padding-top:160px; }
  body[data-density="airy"] .hero{ padding-top:120px; padding-bottom:120px; }
  body[data-density="airy"] .tl-item{ padding:32px 8px; }
  body[data-density="airy"] .proj-grid{ gap:28px; }

  /* project card as button reset (when detail exists) */
  .proj-card.is-button{
    background:var(--card);
    border:1px solid var(--line);
    padding:0;
    text-align:inherit;
    font:inherit;
    color:inherit;
    cursor:pointer;
    appearance:none;
    width:100%;
  }
  .proj-card.is-button:focus-visible{
    outline:2px solid var(--pop);
    outline-offset:3px;
  }

  /* ============ PROJECT CASE STUDY MODAL ============ */
  .modal-backdrop{
    position:fixed; inset:0; z-index:9000;
    background:color-mix(in oklch, var(--bg) 70%, #000 30%);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex; justify-content:center; align-items:stretch;
    animation:modalFade .18s ease-out;
  }
  body[data-theme="dark"] .modal-backdrop{
    background:color-mix(in oklch, #000 70%, transparent);
  }

  @keyframes modalFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes modalRise{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .modal-shell{
    position:fixed; inset:0;
    background:var(--bg);
    border:1px solid var(--line-strong);
    border-radius:0;
    display:flex; flex-direction:column;
    overflow:hidden;
    animation:modalRise .22s ease-out;
  }

  .modal-topbar{
    flex:0 0 auto;
    height:56px; padding:0 24px;
    display:flex; justify-content:space-between; align-items:center;
    gap:16px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky; top:0; z-index:3;
  }
  .modal-topbar-left{
    display:flex; align-items:center; gap:16px; min-width:0;
  }
  .modal-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.12em;
  }
  .modal-counter{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--fg-2); letter-spacing:0.04em;
    padding:4px 10px; border:none; border-radius:999px;
    background:color-mix(in oklch, var(--fg) 6%, transparent);
  }
  .modal-close{
    width:36px; height:36px; border-radius:50%;
    background:transparent; border:none; outline:none;
    display:grid; place-items:center;
    color:var(--fg-2);
    cursor:pointer; transition:all .18s ease;
    flex:0 0 auto;
    padding:0;
  }
  .modal-close:hover{ background:var(--card); color:var(--fg); }
  .modal-close:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  body[data-theme="dark"] .modal-close{ border:none; }

  .modal-viewport{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    overscroll-behavior:contain;
    touch-action:pan-y;
  }
  .modal-track{
    display:flex;
    height:100%;
    width:100%;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .modal-track.is-dragging{
    transition:none;
  }

  .modal-section{
    flex:0 0 100%;
    width:100%;
    min-width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    padding:48px max(24px, calc((100% - var(--maxw)) / 2)) 96px;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .modal-section[aria-hidden="true"]{
    pointer-events:none;
  }

  .modal-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px; height:44px; border-radius:50%;
    background:var(--card);
    border:none; outline:none;
    color:var(--fg);
    display:grid; place-items:center;
    cursor:pointer;
    z-index:2;
    padding:0;
    box-shadow:0 2px 10px -4px color-mix(in oklch, var(--fg) 24%, transparent);
    transition:background .18s ease, color .18s ease, opacity .18s ease, transform .18s ease;
  }
  .modal-nav:hover:not(:disabled){
    background:var(--pop); color:#fff;
  }
  .modal-nav:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  .modal-nav:disabled{
    opacity:.35; pointer-events:none; cursor:default;
  }
  .modal-nav-prev{ left:16px; }
  .modal-nav-next{ right:16px; }

  .modal-dots{
    position:absolute;
    left:50%; bottom:24px;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    padding:8px 12px;
    background:color-mix(in oklch, var(--bg) 70%, transparent);
    border:1px solid var(--line);
    border-radius:999px;
    backdrop-filter:blur(8px);
    z-index:2;
  }
  .modal-dot{
    width:8px; height:8px; border-radius:999px;
    background:var(--line-strong);
    border:none; outline:none; padding:0;
    cursor:pointer;
    transition:width .25s cubic-bezier(.2,.8,.2,1), background .18s ease;
  }
  .modal-dot:hover{ background:var(--fg-3); }
  .modal-dot:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  .modal-dot[aria-current="true"]{
    width:24px;
    background:var(--pop);
  }

  .ms-eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.12em;
    margin-bottom:24px;
  }
  .ms-eyebrow-main{ color:var(--pop); }
  .ms-headline{
    font-size:clamp(24px, 3.2vw, 36px);
    font-weight:600; letter-spacing:-0.02em; line-height:1.25;
    margin:0 0 24px;
    color:var(--fg);
  }
  .ms-headline-lg{
    font-size:clamp(28px, 3.8vw, 44px);
    max-width:36ch;
  }
  .ms-headline-serif{
    font-family:'Instrument Serif',serif; font-style:italic; font-weight:400;
    letter-spacing:-0.01em;
  }

  /* HERO (01) */
  .ms-hero{}
  .ms-hero-title{
    font-size:clamp(40px, 5vw, 64px);
    font-weight:600; letter-spacing:-0.025em; line-height:1.1;
    margin:0 0 16px;
  }
  .ms-hero-tagline{
    font-size:clamp(16px, 1.6vw, 20px);
    color:var(--fg-2); line-height:1.5;
    margin:0 0 40px;
    max-width:720px;
  }
  .ms-hero-meta{
    display:flex; flex-wrap:wrap; gap:32px;
    padding-top:24px; border-top:1px solid var(--line);
  }
  .ms-hero-meta > span{
    display:flex; flex-direction:column; gap:4px;
  }
  .ms-meta-k{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.1em;
  }
  .ms-meta-v{
    font-size:14px; color:var(--fg); font-weight:500;
  }

  /* NEEDS (02) */
  .ms-needs{}
  .ms-needs-body p{
    font-size:16px; color:var(--fg-2); line-height:1.65;
    margin:0 0 24px;
  }
  .ms-bullets{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .ms-bullets li{
    position:relative; padding-left:20px;
    color:var(--fg-2); font-size:14px; line-height:1.6;
  }
  .ms-bullets li::before{
    content:""; position:absolute; left:0; top:9px;
    width:6px; height:6px; border-radius:50%;
    background:var(--pop);
  }

  /* SOLUTION (03) — MAIN */
  .ms-solution{
    background:color-mix(in oklch, var(--pop) 3%, var(--bg));
    box-shadow:inset 4px 0 0 var(--pop);
  }
  .ms-phase-grid{
    display:grid; grid-template-columns:1fr; gap:16px;
    margin:32px 0 40px;
  }
  .ms-phase{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    display:flex; flex-direction:column; gap:8px;
  }
  .ms-phase-num{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--pop); letter-spacing:0.1em;
  }
  .ms-phase-title{
    font-size:18px; font-weight:600; letter-spacing:-0.015em;
  }
  .ms-phase-body{
    font-size:14px; color:var(--fg-2); line-height:1.6;
    margin:0; flex:1;
  }
  .ms-phase-artifact{
    margin-top:8px; padding-top:12px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.02em;
  }
  .ms-deliverables{
    padding-top:24px; border-top:1px solid var(--line);
  }
  .ms-deliv-label{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:12px;
  }
  .ms-deliv-chips{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .ms-chip{
    display:inline-flex; align-items:center;
    padding:6px 12px;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:999px;
    font-size:13px; color:var(--fg);
  }

  /* OUTCOME (04) */
  .ms-outcome{}
  .ms-outcome-metrics{
    display:grid; grid-template-columns:1fr; gap:16px;
    margin:32px 0 40px;
  }
  .ms-metric{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 24px;
    display:flex; flex-direction:column; gap:8px;
  }
  .ms-metric-value{
    font-size:clamp(32px, 4vw, 48px);
    font-weight:700; letter-spacing:-0.025em; line-height:1;
    color:var(--fg);
  }
  .ms-metric-label{
    font-size:13px; color:var(--fg-3);
  }
  .ms-quote{
    margin:0; padding:32px 24px;
    border-left:3px solid var(--pop);
    background:color-mix(in oklch, var(--pop) 4%, var(--bg));
  }
  .ms-quote p{
    font-family:'Instrument Serif',serif; font-style:italic; font-weight:400;
    font-size:clamp(20px, 2.2vw, 26px);
    line-height:1.45; margin:0 0 12px;
    color:var(--fg-2);
  }
  .ms-quote cite{
    font-style:normal;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.1em;
  }

  /* REFLECTION (05) */
  .ms-reflection{
    max-width:640px;
  }
  .ms-reflection-body{
    font-size:16px; color:var(--fg-2); line-height:1.7;
    margin:0 0 24px;
  }
  .ms-takeaways{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .ms-takeaways li{
    position:relative; padding:16px 16px 16px 36px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--fg-2); font-size:14px; line-height:1.55;
  }
  .ms-takeaways li::before{
    content:"→"; position:absolute; left:14px; top:16px;
    color:var(--pop); font-weight:600;
  }

  /* ============ PROJECT 01 EXTENSIONS (compact) ============ */
  /* HERO: 좌우 2컬럼 (이미지 + 클라이언트) */
  .ms-hero-compact{
    margin-top:28px;
    display:grid; grid-template-columns:1fr; gap:20px;
    align-items:start;
  }
  .ms-hero-image{
    margin:0; padding:0;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    overflow:hidden; background:var(--card);
    width:100%; max-width:280px;
  }
  .ms-hero-image img{ display:block; width:100%; height:100%; object-fit:cover; }

  /* 공통 이미지 placeholder */
  .ms-image-ph{
    width:100%; height:100%;
    display:grid; place-items:center; gap:6px;
    background-image:
      repeating-linear-gradient(45deg,
        color-mix(in oklch, var(--pop) 8%, transparent) 0 1px,
        transparent 1px 10px),
      linear-gradient(135deg,
        color-mix(in oklch, var(--pop) 4%, var(--card)),
        var(--card));
    color:var(--fg-3);
  }
  .ms-image-ph-tag{
    font-family:'JetBrains Mono',monospace; font-size:9px;
    letter-spacing:0.18em; padding:3px 8px;
    border:1px solid var(--line-strong); border-radius:999px; background:var(--bg);
  }
  .ms-image-ph-text{ font-size:11px; color:var(--fg-3); text-align:center; padding:0 12px; }

  /* HERO: 클라이언트 칩 그룹 */
  .ms-clients{ min-width:0; }
  .ms-clients-label{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.14em;
    margin-bottom:12px;
  }
  .ms-clients-groups{ display:grid; grid-template-columns:1fr; gap:14px; }
  .ms-clients-group-name{ font-size:11px; color:var(--fg-3); margin-bottom:6px; }
  .ms-clients-chips{ display:flex; flex-wrap:wrap; gap:4px; }
  .ms-client-chip{
    display:inline-flex; align-items:center;
    padding:4px 10px; font-size:12px; color:var(--fg);
    background:var(--card); border:1px solid var(--line-strong); border-radius:999px;
  }

  /* SOLUTION: phase bullets */
  .ms-phase-bullets{
    list-style:none; padding:0; margin:6px 0 10px;
    display:flex; flex-direction:column; gap:4px;
  }
  .ms-phase-bullets li{
    position:relative; padding-left:12px;
    font-size:12.5px; color:var(--fg-2); line-height:1.5;
  }
  .ms-phase-bullets li::before{
    content:""; position:absolute; left:0; top:8px;
    width:3px; height:3px; border-radius:50%;
    background:color-mix(in oklch, var(--pop) 70%, var(--fg-3));
  }

  /* SOLUTION: 단계 사이 화살표 (오밀조밀) */
  .ms-phase-grid-flow{ align-items:stretch; gap:10px; }
  .ms-phase-grid-flow .ms-phase{ padding:14px; }
  .ms-phase-arrow{
    display:grid; place-items:center; color:var(--pop);
    transform:rotate(90deg); padding:2px 0;
  }

  /* OUTCOME: Role flow */
  .ms-roleflow{
    margin:18px 0 22px; padding:14px 16px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
  }
  .ms-roleflow-label{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--fg-3); text-transform:uppercase; letter-spacing:0.14em;
    margin-bottom:10px;
  }
  .ms-roleflow-steps{
    list-style:none; padding:0; margin:0;
    display:flex; flex-direction:column; gap:8px;
    position:relative;
  }
  .ms-roleflow-step{
    display:flex; align-items:flex-start; gap:10px;
    padding:8px 10px; background:var(--bg);
    border:1px solid var(--line); border-radius:6px; position:relative;
  }
  .ms-roleflow-step + .ms-roleflow-step::before{
    content:"↓"; position:absolute; left:18px; top:-12px;
    color:var(--pop); font-size:11px; line-height:1;
  }
  .ms-roleflow-step-num{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--pop); padding-top:2px;
  }
  .ms-roleflow-step-text{ font-size:12.5px; color:var(--fg); line-height:1.5; }

  /* REFLECTION: 정성 피드백 카드 */
  .ms-reflection.has-feedback,
  .ms-reflection:has(.ms-feedback-grid){ max-width:none; }
  .ms-feedback-grid{
    display:grid; grid-template-columns:1fr; gap:10px;
    margin-top:18px;
  }
  .ms-feedback-card{
    margin:0; padding:14px 16px;
    background:var(--card); border:1px solid var(--line);
    border-left:2px solid var(--pop); border-radius:6px;
    display:flex; flex-direction:column; gap:6px;
  }
  .ms-feedback-tag{
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--pop); text-transform:uppercase; letter-spacing:0.14em;
  }
  .ms-feedback-quote{
    margin:0; font-family:'Instrument Serif',serif; font-style:italic;
    font-size:15px; line-height:1.5; color:var(--fg-2);
  }

  /* ============ PROJECT 01 SCROLL LAYOUT ============ */
  .modal-viewport-scroll{
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .ms-scroll{

    if (kind === "mic") return <svg {...c}><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><line x1="12" y1="18" x2="12" y2="22" /><line x1="9" y1="22" x2="15" y2="22" /></svg>;
    return null;
  };

  const SLIDE_COUNT = 5;

  function ProjectModal({ project, onClose, closeBtnRef }) {
    const [slideIndex, setSlideIndex] = useState(0);
    const trackRef = React.useRef(null);
    const viewportRef = React.useRef(null);
    const dragRef = React.useRef({ active: false, startX: 0, startY: 0, startT: 0, dx: 0, locked: false, axis: null });

    React.useEffect(() => { setSlideIndex(0); }, [project]);

    const goTo = React.useCallback((i) => {
      setSlideIndex((prev) => {
        const next = Math.max(0, Math.min(SLIDE_COUNT - 1, i));
        return next === prev ? prev : next;
      });
    }, []);
    const goPrev = React.useCallback(() => goTo(slideIndex - 1), [goTo, slideIndex]);
    const goNext = React.useCallback(() => goTo(slideIndex + 1), [goTo, slideIndex]);

    React.useEffect(() => {
      if (!project) return;
      const onArrow = (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        const t = e.target;
        const tag = t && t.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable)) return;
        if (e.key === "ArrowLeft") { e.preventDefault(); setSlideIndex((i) => Math.max(0, i - 1)); }
        else { e.preventDefault(); setSlideIndex((i) => Math.min(SLIDE_COUNT - 1, i + 1)); }
      };
      document.addEventListener("keydown", onArrow);
      return () => document.removeEventListener("keydown", onArrow);
    }, [project]);

    if (!project) return null;
    const d = project.detail;
    if (!d) return null;

    const onBackdrop = (e) => {
      if (e.target === e.currentTarget) onClose();
    };

    const reduceMotion = typeof window !== "undefined" &&
      window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const onTouchStart = (e) => {
      if (e.touches.length !== 1) return;
      const tch = e.touches[0];
      dragRef.current = {
        active: true, startX: tch.clientX, startY: tch.clientY,
        startT: performance.now(), dx: 0, locked: false, axis: null
      };
      if (trackRef.current) trackRef.current.classList.add("is-dragging");
    };
    const onTouchMove = (e) => {
      const st = dragRef.current;
      if (!st.active) return;
      const tch = e.touches[0];
      const dx = tch.clientX - st.startX;
      const dy = tch.clientY - st.startY;
      if (!st.locked) {
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          st.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
          st.locked = true;
        }
      }
      if (st.axis !== "x") return;
      st.dx = dx;
      let resist = dx;
      if ((slideIndex === 0 && dx > 0) || (slideIndex === SLIDE_COUNT - 1 && dx < 0)) {
        resist = dx * 0.3;
      }
      if (!reduceMotion && trackRef.current) {
        trackRef.current.style.transform = `translateX(calc(${-slideIndex * 100}% + ${resist}px))`;
      }
    };
    const onTouchEnd = () => {
      const st = dragRef.current;
      if (!st.active) return;
      const dt = performance.now() - st.startT;
      const dx = st.dx;
      const velocity = dt > 0 ? Math.abs(dx) / dt : 0;
      const passed = Math.abs(dx) > 60 || velocity > 0.4;
      if (trackRef.current) {
        trackRef.current.classList.remove("is-dragging");
        trackRef.current.style.transform = "";
      }
      if (st.axis === "x" && passed) {
        if (dx < 0) setSlideIndex((i) => Math.min(SLIDE_COUNT - 1, i + 1));
        else setSlideIndex((i) => Math.max(0, i - 1));

      dragRef.current = { active: false, startX: 0, startY: 0, startT: 0, dx: 0, locked: false, axis: null };

        role: "group",
        "aria-roledescription": "slide",

                <p key={i}>
                  {q.strong &&
                  <b style={{ fontSize: "22px", lineHeight: 1.35, color: "var(--fg)", fontWeight: 700, fontStyle: "normal", display: "block" }}>
                      {q.strong}
                    </b>
                  }
                  {q.caption && <span style={{ fontSize: "12px", color: "var(--fg-3)", fontStyle: "normal" }}>{q.caption}</span>}
                </p>
                )}
            </div>
            <div className="hero-expertise">
              <div className="hero-section-mini">EXPERTISE</div>
              <div className="hero-tags-grid">
                {CONTACT.expertise.map((e, i) => <span key={i} className="hero-tag">#{e}</span>)}
              </div>
            </div>
            <div className="hero-contact">
              <div className="hero-section-mini">CONTACT</div>
              <div className="hero-contact-row">
                <span className="ic">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 8l9 6 9-6" /><rect x="3" y="5" width="18" height="14" rx="2" /></svg>
                </span>
                <a href={`mailto:${CONTACT.email}`}>{CONTACT.email}</a>
              </div>
              <div className="hero-contact-row">
                <span className="ic">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z" /></svg>
                </span>
                <span>{CONTACT.phone}</span>
              </div>
            </div>
          </div>

          <div className="hero-right">
            <div className="hero-photo">
              <img src="assets/about-photo.png" alt={CONTACT.name} />
            </div>
            <div className="hero-stats">
              {CONTACT.stats.map((s, i) =>
                <div key={i} className="hero-stat">
                  <div className="hero-stat-num">
                    {s.num}<span className="unit">{s.unit}</span>
                  </div>
                  <div className="hero-stat-label">{s.label}</div>
                  <div className="hero-stat-desc">{s.desc}</div>
                </div>
                )}
            </div>
          </div>
        </div>
      </div>
    </section>);

  }

  function ContactFab() {
    const [open, setOpen] = useState(false);
    const wrapRef = React.useRef(null);
    useEffect(() => {
      if (!open) return;
      const onDoc = (e) => {if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);};
      const onKey = (e) => {if (e.key === "Escape") setOpen(false);};
      document.addEventListener("mousedown", onDoc);
      document.addEventListener("keydown", onKey);
      return () => {document.removeEventListener("mousedown", onDoc);document.removeEventListener("keydown", onKey);};
    }, [open]);
    return (
      <div className="fab-wrap" ref={wrapRef}>
      <div className="fab-card" data-open={open ? "1" : "0"} id="contact">
        <div className="fab-card-h">
          <span><span className="dot" />Contact</span>
        </div>
        <div className="fab-row"><span className="k">name</span><span className="v">{CONTACT.name}</span></div>
        <div className="fab-row"><span className="k">role</span><span className="v">{CONTACT.role}</span></div>
        <div className="fab-row"><span className="k">email</span><a className="v" href={`mailto:${CONTACT.email}`}>{CONTACT.email}</a></div>
        <div className="fab-row"><span className="k">phone</span><span className="v">{CONTACT.phone}</span></div>
        <div className="fab-row"><span className="k">based</span><span className="v">{CONTACT.location}</span></div>
        <div className="fab-actions">
          <a className="fab-act primary" href={`mailto:${CONTACT.email}`}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 8l9 6 9-6" /><rect x="3" y="5" width="18" height="14" rx="2" /></svg>
            이메일 보내기
          </a>
        </div>
      </div>
      <button className="fab-btn" data-open={open ? "1" : "0"} aria-label="Contact" onClick={() => setOpen((o) => !o)}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 8l9 6 9-6" /><rect x="3" y="5" width="18" height="14" rx="2" />
        </svg>
      </button>
    </div>);

  }

  function Experience() {
    const [filter, setFilter] = useState("all");
    const [openIdx, setOpenIdx] = useState(0);
    const filtered = useMemo(() => filter === "all" ? TIMELINE : TIMELINE.filter((t) => t.cat === filter), [filter]);
    const counts = useMemo(() => ({
      all: TIMELINE.length,
      activity: TIMELINE.filter((t) => t.cat === "activity").length,
      competition: TIMELINE.filter((t) => t.cat === "competition").length,
      award: TIMELINE.filter((t) => t.cat === "award").length,
      education: TIMELINE.filter((t) => t.cat === "education").length
    }), []);
    const filters = [{ k: "all", label: "전체" }, { k: "activity", label: "대외활동" }, { k: "competition", label: "공모전" }, { k: "award", label: "수상" }, { k: "education", label: "교육이수" }];
    const catLabel = { activity: "대외활동", competition: "공모전", award: "수상", education: "교육이수" };
    return (
      <section id="experience" className="section">
      <div className="container">
        <div className="section-head section-head--stack">
          <div>
            <div className="section-num">Experience</div>
            <h2 className="section-title section-title--bold">정보·경험·메시지를 <em>전달해 온 기획자</em></h2>
            <p className="section-desc section-desc--inline">정보를 알리는 일에서 시작해 학습과 성장을 함께 만드는 일까지<br />사람에게 가닿는 콘텐츠와 교육을 직접 기획하고 운영해 온 활동의 기록들입니다.</p>
          </div>
        </div>
        <div className="filter-bar">
          {filters.map((f) =>
            <button key={f.k} className={"filter-chip " + (filter === f.k ? "on" : "")}
            onClick={() => {setFilter(f.k);setOpenIdx(-1);}}>
              {f.label} <span style={{ opacity: .6, marginLeft: 4 }}>{counts[f.k]}</span>
            </button>
            )}
          <span className="filter-count">{filtered.length} item{filtered.length !== 1 ? "s" : ""}</span>
        </div>
        <div className="timeline">
          {filtered.map((t, i) =>
            <div key={`${t.cat}-${t.date}-${t.title}`} className={"tl-item " + (openIdx === i ? "open" : "")}
            onClick={() => setOpenIdx(openIdx === i ? -1 : i)}>
              <div className="tl-date mono">{t.date}</div>
              <div className="tl-body">
                <div className="tl-title">{t.title}</div>
                <div className="tl-org">{t.org}</div>
                <div className="tl-expand">
                  <p>{t.desc}</p>
                  {t.bullets && <ul>{t.bullets.map((b) => <li key={b}>{b}</li>)}</ul>}
                  {t.skills && <div className="tl-skills">{t.skills.map((s) => <span key={s} className="tag">{s}</span>)}</div>}
                </div>
              </div>
              <div className="tl-meta">
                <span className="tl-cat" data-cat={t.cat}>{catLabel[t.cat]}</span>
                <svg className="tl-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14" /></svg>
              </div>
            </div>
            )}
        </div>
      </div>
    </section>);

  }

  function Projects({ onOpen }) {
    return (
      <section id="projects" className="section">
      <div className="container">
        <div className="section-head section-head--stack">
          <div>
            <div className="section-num">Projects</div>
            <h2 className="section-title section-title--bold">AI <em>교육·컨설팅 및 실무 기록</em></h2>
            <p className="section-desc section-desc--inline">고객사 컨설팅부터 교육 기획 및 운영, 커리큘럼 설계, 사내 도구 제작까지,<br />기획에 그치지 않고 직접 현장에서 수행한 업무 기록들입니다.</p>
          </div>
        </div>
        <div className="proj-grid">
          {PROJECTS.map((p) => (
            <button
              key={p.title}
              type="button"
              className={`proj-card is-button acc-${p.accent}`}
              onClick={(e) => onOpen(p, e.currentTarget)}
            >
              <div className={`proj-thumb${p.detail?.sections?.detail?.image?.src ? " has-image" : ""}`}>
                <div className="proj-thumb-pattern" />
                {p.detail?.sections?.detail?.image?.src ? (
                  <img className="proj-thumb-img" src={p.detail.sections.detail.image.src} alt={p.detail.sections.detail.image.alt || p.title} loading="lazy" style={{ objectFit: p.detail.sections.detail.image.fit || "contain", objectPosition: p.detail.sections.detail.image.position || "center" }} />
                ) : (
                  <div className="proj-thumb-icon"><ProjIcon kind={p.icon} /></div>
                )}
              </div>
              <div className="proj-body">
                <div className="proj-meta-row"><span>{p.role}</span><span className="proj-year">{p.year}</span></div>
                <div className="proj-title">{p.title}</div>
                <div className="proj-desc">{p.desc}</div>
                <div className="proj-stack">{p.stack.map((s) => <span key={s} className="tag">{s}</span>)}</div>
                <div className="proj-foot">
                  <span className="proj-foot-label">Project Details</span>
                  <span className="proj-arrow">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 5l7 7-7 7" /></svg>
                  </span>
                </div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </section>);

  }

  function Footer({ name }) {
    return (
      <footer>
      <div className="container">
        <div className="foot-bottom"><span>© 2026 {name.replace(/\s/g, "")}. Built with care.</span></div>
      </div>
    </footer>);

  }

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [active, setActive] = useState("about");
    const [openProject, setOpenProject] = useState(null);
    const lastFocusRef = React.useRef(null);
    const closeBtnRef = React.useRef(null);

    useEffect(() => {
      document.body.dataset.theme = t.theme;
      document.body.dataset.bg = t.bgTone;
      document.body.dataset.density = t.density;
      document.body.dataset.hero = t.heroStyle;
      document.documentElement.style.setProperty("--pop", t.popColor);
    }, [t]);

    useEffect(() => {
      const ids = ["about", "projects", "experience"];
      const onScroll = () => {
        const triggerY = 120; // header height + a bit
        let current = ids[0];
        for (const id of ids) {
          const el = document.getElementById(id);
          if (!el) continue;
          const top = el.getBoundingClientRect().top;
          if (top - triggerY <= 0) current = id;
        }
        setActive(current);
      };
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      return () => {
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onScroll);
      };
    }, []);

    useEffect(() => {
      if (!openProject) return;
      const prevOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      const onKey = (e) => { if (e.key === "Escape") setOpenProject(null); };
      document.addEventListener("keydown", onKey);
      const raf = requestAnimationFrame(() => closeBtnRef.current?.focus());
      return () => {
        document.body.style.overflow = prevOverflow;
        document.removeEventListener("keydown", onKey);
        cancelAnimationFrame(raf);
        lastFocusRef.current?.focus();
      };
    }, [openProject]);

    // 해시 → 모달 동기화 (마운트 시 + popstate + hashchange)
    useEffect(() => {
      const parseHash = () => {
        const m = location.hash.match(/^#project-0([1-8])$/);
        if (m) {
          const idx = Number(m[1]) - 1;
          const p = PROJECTS[idx];
          if (p) { setOpenProject(p); return; }
        }
        setOpenProject(null);
      };
      parseHash();
      window.addEventListener("popstate", parseHash);
      window.addEventListener("hashchange", parseHash);
      return () => {
        window.removeEventListener("popstate", parseHash);
        window.removeEventListener("hashchange", parseHash);
      };
    }, []);

    // 모달 → 해시 반영
    useEffect(() => {
      if (openProject) {
        const idx = PROJECTS.indexOf(openProject) + 1;
        const target = `#project-${String(idx).padStart(2, "0")}`;
        if (location.hash === target) return;
        const method = location.hash ? "replaceState" : "pushState";
        history[method](null, "", target);
      } else {
        if (/^#project-/.test(location.hash)) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      }
    }, [openProject]);

    return (
      <>
      <div id="top" />
      <Header active={active} name={t.name} />
      <main>
        <Hero tagline={t.tagline} subline={t.subline} name={t.name} />
        <Projects onOpen={(p, el) => { lastFocusRef.current = el; setOpenProject(p); }} />
        <Experience />
      </main>
      <Footer name={t.name} />
      <ContactFab />
      <ProjectModal project={openProject} onClose={() => setOpenProject(null)} closeBtnRef={closeBtnRef} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Color mode" value={t.theme}
          options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]}
          onChange={(v) => setTweak("theme", v)} />
        <TweakSelect label="Background" value={t.bgTone}
          options={[
          { value: "lilac", label: "Lilac · 은은한 연보라" },
          { value: "lavender", label: "Lavender · 더 진한 보라" },
          { value: "plum", label: "Plum · 깊은 자줏빛 (다크)" },
          { value: "pure", label: "Pure · 순백 + 포인트" }]
          }
          onChange={(v) => setTweak("bgTone", v)} />
        <TweakColor label="Key color" value={t.popColor}
          onChange={(v) => setTweak("popColor", v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={[{ value: "dense", label: "Dense" }, { value: "regular", label: "Regular" }, { value: "airy", label: "Airy" }]}
          onChange={(v) => setTweak("density", v)} />
        <TweakRadio label="Hero type" value={t.heroStyle}
          options={[{ value: "sans", label: "Sans" }, { value: "serif", label: "Serif" }, { value: "display", label: "Bold" }, { value: "mono", label: "Mono" }]}
          onChange={(v) => setTweak("heroStyle", v)} />

        <TweakSection label="Copy" />
        <TweakText label="Name" value={t.name} onChange={(v) => setTweak("name", v)} />
        <TweakText label="Tagline" value={t.tagline} onChange={(v) => setTweak("tagline", v)} />
      </TweaksPanel>
    </>);

  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
</body>
</html>
